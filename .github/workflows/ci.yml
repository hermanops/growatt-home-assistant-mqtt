name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Pinned: ubuntu-latest (26.04) no longer ships older Python toolcaches
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = floor (pymodbus 3.10+); 3.13 = Raspberry Pi OS / Debian 13 target
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Byte-compile
        run: python -m py_compile solarmon.py growatt.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Import check
        run: python -c "import growatt"
